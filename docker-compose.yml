version: '3'
services:
  mongodb:
    image: mongo:6.0
    container_name: student-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongodbdata:/data/db

  backend:
    build: ./backend
    container_name: student-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/student_db
    depends_on:
      - mongodb
